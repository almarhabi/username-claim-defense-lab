name: Telegram lab bot 24h

# Each hosted job stops before GitHub's six-hour limit. A successful long run
# dispatches its replacement; the schedule is a fallback after an early crash.
on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "bot/**"
      - "tests/**"
      - "launcher.py"
      - "requirements.txt"
      - ".github/workflows/lab-controller.yml"

# Telegram permits only one polling consumer per bot token. A replacement run
# queues behind the current run; a code push replaces the older running version.
concurrency:
  group: synthetic-telegram-lab
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      LAB_ADMIN_KEY: ${{ secrets.LAB_ADMIN_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      LAB_FIXTURE_PASSWORD: lab-only-password
      LAB_DATA_DIR: .lab-data
      LAB_SESSION_TTL_SECONDS: "604800"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Validate runtime configuration
        shell: bash
        run: |
          set -euo pipefail
          for variable in LAB_ADMIN_KEY TELEGRAM_BOT_TOKEN; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::$variable must be configured in Actions secrets"
              exit 1
            fi
            if [[ "${!variable}" == *$'\n'* || "${!variable}" == *$'\r'* ]]; then
              echo "::error::$variable must be a single-line value"
              exit 1
            fi
          done

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Verify Telegram authentication
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import asyncio
          import os

          from telegram import Bot

          async def verify() -> None:
              async with Bot(os.environ["TELEGRAM_BOT_TOKEN"]) as bot:
                  identity = await bot.get_me()
                  print(f"Telegram authentication succeeded for @{identity.username}")

          asyncio.run(verify())
          PY

      - name: Prepare persistent lab directory
        run: mkdir -p .lab-data

      - name: Restore synthetic lab state
        uses: actions/cache/restore@v4
        with:
          path: .lab-data
          key: lab-data-${{ github.run_id }}
          restore-keys: lab-data-

      - name: Run bot and lab API
        id: bot
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          start=$(date +%s)
          timeout --signal=SIGINT --kill-after=20s 340m python launcher.py
          result=$?
          elapsed=$(( $(date +%s) - start ))

          if [[ "$result" -eq 124 && "$elapsed" -ge 19800 ]]; then
            echo "restart=true" >> "$GITHUB_OUTPUT"
            echo "Planned restart window reached; synthetic state will be saved."
            exit 0
          fi

          echo "::error::Bot exited before the planned restart window (status=$result, elapsed=${elapsed}s)"
          echo "The 30-minute schedule will retry after an early failure."
          if [[ "$result" -eq 0 ]]; then
            exit 1
          fi
          exit "$result"

      - name: Save synthetic lab state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .lab-data
          key: lab-data-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Remove superseded state snapshots
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: lab-data-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          keys=$(gh cache list --key lab-data- --limit 100 --json key --jq '.[].key')
          if ! grep -qx "$KEEP" <<< "$keys"; then
            echo "No new state snapshot was saved; retaining the previous snapshot."
            exit 0
          fi
          while IFS= read -r key; do
            if [[ -n "$key" && "$key" != "$KEEP" ]]; then
              gh cache delete "$key" || true
            fi
          done <<< "$keys"

      - name: Dispatch replacement run
        if: steps.bot.outputs.restart == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run lab-controller.yml --ref "${{ github.ref_name }}"

      - name: Preserve an early failure as a failed run
        if: steps.bot.outcome == 'failure'
        run: exit 1

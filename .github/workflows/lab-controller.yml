name: telegram-runtime-check

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: Temporary polling duration in minutes (1-330), not permanent hosting
        required: true
        default: "5"
        type: string

permissions:
  contents: read

concurrency:
  group: synthetic-telegram-polling
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      RUN_MINUTES: ${{ inputs.minutes }}
      LAB_ADMIN_KEY: ${{ secrets.LAB_ADMIN_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      LAB_FIXTURE_PASSWORD: lab-only-password
      LAB_DATA_DIR: ${{ runner.temp }}/synthetic-lab-data
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Validate runtime configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RUN_MINUTES" =~ ^[0-9]+$ ]] || (( RUN_MINUTES < 1 || RUN_MINUTES > 330 )); then
            echo "::error::minutes must be an integer from 1 through 330"
            exit 1
          fi
          for variable in LAB_ADMIN_KEY TELEGRAM_BOT_TOKEN; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::$variable must be configured in Actions secrets"
              exit 1
            fi
            if [[ "${!variable}" == *$'\n'* || "${!variable}" == *$'\r'* ]]; then
              echo "::error::$variable must be a single-line value"
              exit 1
            fi
          done

      - name: Verify Telegram authentication
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import asyncio
          import os

          from telegram import Bot

          async def verify() -> None:
              async with Bot(os.environ["TELEGRAM_BOT_TOKEN"]) as bot:
                  identity = await bot.get_me()
                  print(f"Telegram authentication succeeded for @{identity.username}")

          asyncio.run(verify())
          PY

      - name: Run Telegram polling for the requested temporary window
        shell: bash
        run: |
          set -uo pipefail
          timeout --signal=SIGINT --kill-after=20s "${RUN_MINUTES}m" python launcher.py
          result=$?
          if [[ "$result" -eq 124 ]]; then
            echo "The temporary polling window completed; the runner will now stop."
            exit 0
          fi
          if [[ "$result" -eq 0 ]]; then
            echo "::error::The bot stopped before the requested polling window ended"
            exit 1
          fi
          echo "::error::The bot exited unexpectedly with status $result"
          exit "$result"

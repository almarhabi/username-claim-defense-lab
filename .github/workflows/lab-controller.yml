name: Telegram lab bot 24h

# A hosted job cannot run forever. It exits before GitHub's six-hour limit,
# saves synthetic state, and dispatches one replacement. The separate watchdog
# workflow retries after an early crash without filling the concurrency queue.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "bot/**"
      - "tests/**"
      - "launcher.py"
      - "telegram_preflight.py"
      - "requirements.txt"
      - "dev-requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/lab-controller.yml"

concurrency:
  group: synthetic-telegram-lab
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      LAB_ADMIN_KEY: ${{ secrets.LAB_ADMIN_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      LAB_FIXTURE_PASSWORD: lab-only-password
      LAB_DATA_DIR: .lab-data
      LAB_SESSION_TTL_SECONDS: "604800"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Validate runtime configuration
        shell: bash
        run: |
          set -euo pipefail
          for variable in LAB_ADMIN_KEY TELEGRAM_BOT_TOKEN; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::$variable must be configured in Actions secrets"
              exit 1
            fi
            if [[ "${!variable}" == *$'\n'* || "${!variable}" == *$'\r'* ]]; then
              echo "::error::$variable must be a single-line value"
              exit 1
            fi
          done

      - name: Install Python dependencies
        run: pip install -r dev-requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q app bot tests launcher.py telegram_preflight.py

      - name: Run Ruff
        run: ruff check app bot tests launcher.py telegram_preflight.py

      - name: Run unit tests
        shell: bash
        run: |
          set -uo pipefail
          set +e
          python -m pytest -vv --tb=short 2>&1 | tee pytest-output.txt
          result=${PIPESTATUS[0]}
          set -e
          if [[ "$result" -ne 0 ]]; then
            python - <<'PY'
          from pathlib import Path

          lines = Path("pytest-output.txt").read_text(encoding="utf-8").splitlines()
          failures = [
              line for line in lines
              if line.startswith(("FAILED ", "ERROR ", "ERROR collecting "))
          ]
          selected = failures or ["Pytest failed; final output: " + " | ".join(lines[-25:])]
          for line in selected:
              message = line.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error::{message[:8000]}")
          PY
          fi
          exit "$result"

      - name: Verify Telegram authentication and polling availability
        run: python telegram_preflight.py

      - name: Prepare persistent lab directory
        run: mkdir -p .lab-data

      - name: Restore synthetic lab state
        uses: actions/cache/restore@v4
        with:
          path: .lab-data
          key: lab-data-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: lab-data-

      - name: Run bot and lab API
        id: bot
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          start=$(date +%s)
          echo "Starting launcher at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          timeout --signal=SIGINT --kill-after=20s 340m python -u launcher.py
          result=$?
          elapsed=$(( $(date +%s) - start ))
          echo "Launcher stopped with status=$result after ${elapsed}s"

          if [[ "$result" -eq 124 && "$elapsed" -ge 19800 ]]; then
            echo "restart=true" >> "$GITHUB_OUTPUT"
            echo "Planned restart window reached; synthetic state will be saved."
            exit 0
          fi

          echo "::error::Bot exited before the planned restart window (status=$result, elapsed=${elapsed}s)"
          echo "The independent watchdog will retry after an early failure."
          if [[ "$result" -eq 0 ]]; then
            exit 1
          fi
          exit "$result"

      - name: Save synthetic lab state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .lab-data
          key: lab-data-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Remove superseded state snapshots
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: lab-data-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          keys=$(gh cache list --key lab-data- --limit 100 --json key --jq '.[].key')
          if ! grep -qx "$KEEP" <<< "$keys"; then
            echo "No new state snapshot was saved; retaining the previous snapshot."
            exit 0
          fi
          while IFS= read -r key; do
            if [[ -n "$key" && "$key" != "$KEEP" ]]; then
              gh cache delete "$key" || true
            fi
          done <<< "$keys"

      - name: Dispatch exactly one replacement run
        if: steps.bot.outputs.restart == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run lab-controller.yml --ref "${{ github.ref_name }}"

      - name: Preserve an early failure as a failed run
        if: steps.bot.outcome == 'failure'
        run: exit 1

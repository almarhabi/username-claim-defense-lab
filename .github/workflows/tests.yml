name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dev-requirements.txt
      - name: Install dependencies
        run: pip install -r dev-requirements.txt
      - name: Compile application
        run: python -m compileall -q app bot tests launcher.py telegram_preflight.py
      - name: Static checks
        run: ruff check app bot tests launcher.py telegram_preflight.py
      - name: Run tests
        run: python -m pytest

  api-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LAB_ADMIN_KEY: integration-only-admin-key
      LAB_DATA_DIR: ${{ runner.temp }}/synthetic-lab-data
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Start Python API without Docker
        shell: bash
        run: |
          set -euo pipefail
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/lab-api.log" 2>&1 &
          echo "LAB_PID=$!" >> "$GITHUB_ENV"
      - name: Verify health and isolation marker
        shell: bash
        run: |
          set -euo pipefail
          healthy=false
          for _ in {1..45}; do
            if curl --silent --fail http://127.0.0.1:8000/health > "$RUNNER_TEMP/lab-health.json"; then
              healthy=true
              break
            fi
            sleep 1
          done
          if [[ "$healthy" != true ]]; then
            cat "$RUNNER_TEMP/lab-api.log"
            exit 1
          fi
          python - <<'PY'
          import json
          import os

          with open(os.path.join(os.environ["RUNNER_TEMP"], "lab-health.json"), encoding="utf-8") as handle:
              data = json.load(handle)
          assert data == {"status": "ok", "lab_only": True, "domain": "social.lab.internal"}
          print("Synthetic API health check passed")
          PY
      - name: Show API logs after a failure
        if: failure()
        run: cat "$RUNNER_TEMP/lab-api.log"
      - name: Stop ephemeral API
        if: always()
        shell: bash
        run: |
          if [[ -n "${LAB_PID:-}" ]]; then
            kill "$LAB_PID" 2>/dev/null || true
            wait "$LAB_PID" 2>/dev/null || true
          fi
